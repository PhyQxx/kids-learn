server:
  port: 19084

spring:
  application:
    name: kidslearn
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kidslearn.api.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.kidslearn: info
    # 降低 MyBatis mapper 层日志级别，避免高频轮询 SQL 刷屏（真正错误仍由业务日志输出）
    com.kidslearn.api.mapper: warn
    org.mybatis: warn
    org.apache.ibatis: warn

# 通知发件箱轮询：把高频空轮询的日志与事务开销降到合理水平
notification:
  outbox:
    poll-ms: 30000

ftp:
  # ftp地址
  host: ${FTP_HOST:127.0.0.1}
  # ftp端口
  port: ${FTP_PORT:21}
  # ftp用户名
  username: ${FTP_USERNAME:admin}
  # ftp密码
  password: ${FTP_PASSWORD:}
  # ftp上传路径
  path: /ftp/
  site-url: ${FTP_URL_PREFIX:}


payment:
  callback:
    secret: ${PAYMENT_CALLBACK_SECRET:}

# 订单超时清理：未支付订单超过该时长（分钟）后由定时任务关闭
order:
  cleanup:
    timeout-minutes: ${ORDER_CLEANUP_TIMEOUT_MINUTES:30}
