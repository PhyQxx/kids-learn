server:
  port: 19084

spring:
  application:
    name: kidslearn
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/kids_learn?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kidslearn.api.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.kidslearn: debug

ftp:
  host:
  port: 21
  username:
  password:
  path: /ftp
  site-url:

question:
  audio:
    tts-command: ${QUESTION_AUDIO_TTS_COMMAND:/opt/moss-tts/bin/moss-tts-nano}
    backend: ${QUESTION_AUDIO_BACKEND:onnx}
    voice: ${QUESTION_AUDIO_VOICE:Junhao}
    temp-dir: ${QUESTION_AUDIO_TEMP_DIR:${java.io.tmpdir}}
    timeout: ${QUESTION_AUDIO_TIMEOUT:5m}

ai:
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  model: ${AI_MODEL:deepseek-chat}
  timeout: ${AI_TIMEOUT:15}
