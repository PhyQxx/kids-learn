server:
  port: 19084

spring:
  application:
    name: kidslearn
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kidslearn.api.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.kidslearn: info

ftp:
  # ftp地址
  host: ${FTP_HOST:127.0.0.1}
  # ftp端口
  port: ${FTP_PORT:21}
  # ftp用户名
  username: ${FTP_USERNAME:admin}
  # ftp密码
  password: ${FTP_PASSWORD:}
  # ftp上传路径
  path: /ftp/
  site-url: ${FTP_URL_PREFIX:}


payment:
  callback:
    secret: ${PAYMENT_CALLBACK_SECRET:}
