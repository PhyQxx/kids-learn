server:
  port: 19084

spring:
  application:
    name: kidslearn
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kidslearn.api.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.kidslearn: info

ftp:
  host:
  port: 21
  username:
  password:
  path: /ftp
  site-url:

question:
  audio:
    tts-command: ${QUESTION_AUDIO_TTS_COMMAND:/opt/moss-tts/bin/moss-tts-nano}
    backend: ${QUESTION_AUDIO_BACKEND:onnx}
    voice: ${QUESTION_AUDIO_VOICE:Junhao}
    temp-dir: ${QUESTION_AUDIO_TEMP_DIR:${java.io.tmpdir}}
    timeout: ${QUESTION_AUDIO_TIMEOUT:5m}

ai:
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  model: ${AI_MODEL:deepseek-chat}
  timeout: ${AI_TIMEOUT:15}

payment:
  callback:
    secret: ${PAYMENT_CALLBACK_SECRET:}
